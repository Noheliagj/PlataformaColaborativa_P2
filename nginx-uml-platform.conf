# =============================================================================
# Configuración Nginx para UML Studio en AWS EC2 (Ubuntu)
# Ruta sugerida en EC2: /etc/nginx/sites-available/uml-studio
# Activar con: sudo ln -s /etc/nginx/sites-available/uml-studio /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    server_name _;  # Acepta la IP pública de EC2 o cualquier dominio

    # Tamaño máximo de subida para importar diagramas XMI e imágenes grandes
    client_max_body_size 50M;

    # 1. Frontend Web (Vite + React SPA compilado)
    root /var/www/uml-studio/frontend-web/dist;
    index index.html;

    # Redirección de rutas SPA (React Router) hacia index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché agresiva para artefactos estáticos versionados de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. WebSockets en tiempo real (Socket.IO en /socket.io/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts largos para mantener abiertas las conexiones WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Proxy hacia la API NestJS (puerto 3000 de PM2)
    # Permite consumir la API directamente en el puerto 80 bajo /api/
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy para rutas directas del backend (auth, projects, notifications)
    location ~ ^/(auth|projects|notifications|users)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
